name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs the pinned devDependency rather than the action, so CI and a local
      # `npm run validate` lint with the same version. Two copies of a rule that
      # can drift is the failure this repo keeps paying for.
      - name: Markdown lint
        run: npm run validate:markdown

      - name: Validate sample vault against schemas
        run: npm run validate:schemas

      - name: Schema copy parity
        run: npm run validate:schema-parity

      - name: Spec package version agreement
        run: npm run validate:spec-package

      - name: Brand-isolation guard
        run: npm run validate:brand
        env:
          BRAND_BLOCKLIST: ${{ vars.BRAND_BLOCKLIST }}

      - name: Claude Code skill install smoke test
        run: bash .github/scripts/test-install-claude-code-skill.sh

      - name: Claude Code hook merge idempotency
        run: bash .github/scripts/test-install-hook-idempotency.sh

      - name: Link checker
        uses: lycheeverse/lychee-action@v2
        with:
          # mailto: links are excluded by default in current lychee.
          # Skip vendored READMEs (node_modules) and engineering-process artifacts
          # (docs/superpowers/) — same allowlist logic as markdownlint and brand-isolation.
          # --max-retries 3 / --retry-wait-time 5: handle transient network blips
          # (Connection reset by peer, etc.) on otherwise-stable URLs.
          # --exclude 'claude\.ai' and 'npmjs\.com': both return 403 to lychee's
          # User-Agent despite being valid URLs for human visitors. Exclude rather
          # than adding 403 to --accept (too permissive).
          args: --no-progress --max-retries 3 --retry-wait-time 5 --exclude '^https://claude\.ai' --exclude '^https://www\.npmjs\.com' --exclude-path node_modules --exclude-path docs/superpowers '**/*.md'
